name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: profitbash
          POSTGRES_PASSWORD: profitbash
          POSTGRES_DB: profitbash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U profitbash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      APP_URL: http://localhost:5173
      DATABASE_URL: postgres://profitbash:profitbash@localhost:5432/profitbash_test
      DATABASE_URL_DIRECT: postgres://profitbash:profitbash@localhost:5432/profitbash_test
      DATABASE_URL_TEST: postgres://profitbash:profitbash@localhost:5432/profitbash_test

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
