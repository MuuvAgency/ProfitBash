name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: profitbash
          POSTGRES_PASSWORD: profitbash
          POSTGRES_DB: profitbash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U profitbash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      APP_URL: http://localhost:5173
      DATABASE_URL: postgres://profitbash:profitbash@localhost:5432/profitbash
      DATABASE_URL_DIRECT: postgres://profitbash:profitbash@localhost:5432/profitbash
      DATABASE_URL_TEST: postgres://profitbash:profitbash@localhost:5432/profitbash_test

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Auth-Schema und Migrationen passen zum Code
        run: |
          pnpm --filter @profitbash/api run auth:schema
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db)" ]; then
            git status --porcelain packages/db
            echo "::error::Schema oder Migrationen sind nicht aktuell. Lokal 'pnpm --filter @profitbash/api auth:schema' und 'pnpm db:generate' ausführen und committen."
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Produktions-Bundles starten (migrate, seed, Server, Healthcheck)
        run: scripts/smoke-bundles.sh
        env:
          SMOKE_DATABASE_URL: postgres://profitbash:profitbash@localhost:5432/profitbash
      - name: Backup-Image bauen (Railway-Cron-Service db-backup)
        run: docker build -t profitbash-db-backup ops/db-backup
      - name: Backup und Test-Restore im Image (Fake-S3)
        run: scripts/smoke-db-backup.sh
        env:
          SMOKE_DATABASE_URL: postgres://profitbash:profitbash@localhost:5432/profitbash
          SMOKE_RESTORE_DATABASE_URL: postgres://profitbash:profitbash@localhost:5432/profitbash_restore
          SMOKE_BACKUP_IMAGE: profitbash-db-backup
